name: Daily evidence backup

on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: tornredeye-evidence-backup
  cancel-in-progress: false

jobs:
  backup:
    if: >-
      vars.DAILY_BACKUPS_ENABLED == 'true' &&
      github.repository_id == '1409429829' &&
      github.repository_owner_id == '188345459' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_CORE_OUTPUT: none
      AZURE_CORE_COLLECT_TELEMETRY: 'false'
      AZURE_EXTENSION_USE_DYNAMIC_INSTALL: 'no'
    steps:
      - name: Check out trusted revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install existing S3 dependency
        run: python -m pip install --disable-pip-version-check 'boto3==1.40.4'
      - name: Authenticate AWS through OIDC
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5
        with:
          role-to-assume: ${{ vars.BACKUP_AWS_ROLE_ARN }}
          aws-region: ${{ vars.BACKUP_AWS_REGION }}
          allowed-account-ids: ${{ vars.BACKUP_AWS_OWNER }}
          audience: sts.amazonaws.com
          role-duration-seconds: 4500
          mask-aws-account-id: true
          unset-current-credentials: true
          retry-max-attempts: 3
          action-timeout-s: 120
      - name: Authenticate Azure through OIDC
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        env:
          AZURE_CONFIG_DIR: ${{ runner.temp }}/tornredeye-azure
        with:
          client-id: ${{ vars.BACKUP_AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.BACKUP_AZURE_TENANT_ID }}
          subscription-id: ${{ vars.BACKUP_AZURE_SUBSCRIPTION_ID }}
          audience: api://AzureADTokenExchange
          enable-AzPSSession: false
      - name: Generate temporary SAS and run verified backup
        env:
          AZURE_CONFIG_DIR: ${{ runner.temp }}/tornredeye-azure
          DAILY_BACKUPS_ENABLED: ${{ vars.DAILY_BACKUPS_ENABLED }}
          BACKUP_AWS_BUCKET: ${{ vars.BACKUP_AWS_BUCKET }}
          BACKUP_AWS_OWNER: ${{ vars.BACKUP_AWS_OWNER }}
          BACKUP_AWS_REGION: ${{ vars.BACKUP_AWS_REGION }}
          BACKUP_AZURE_ACCOUNT: ${{ vars.BACKUP_AZURE_ACCOUNT }}
          BACKUP_AZURE_CONTAINER: ${{ vars.BACKUP_AZURE_CONTAINER }}
          BACKUP_BASELINE_CATALOG_SHA256: ${{ vars.BACKUP_BASELINE_CATALOG_SHA256 }}
        run: python -B tools/daily_backup.py
      - name: Remove private temporary files
        if: always()
        shell: bash
        run: |
          rm -rf -- "${RUNNER_TEMP:?}/tornredeye-backup" "${RUNNER_TEMP:?}/tornredeye-azure"
